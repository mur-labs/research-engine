[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-engine"
version = "0.1.0"
description = "AI-powered academic research engine for search planning, multi-API discovery, and evidence extraction."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pypdf>=5.0.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
]

[project.scripts]
research-engine = "research_engine.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/research_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
